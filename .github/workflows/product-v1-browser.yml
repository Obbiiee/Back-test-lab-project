name: Product V1 browser acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/vps/**'
      - '.github/workflows/product-v1-browser.yml'
  push:
    branches: [codex/riksora-v1-integration-20261109]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/vps/**'
      - '.github/workflows/product-v1-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL 16 tools for private test cluster
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-client-16
      - name: Install pinned backend dependencies
        run: python -m pip install --requirement backend/requirements.lock
      - name: Guard authority documents against binary corruption
        working-directory: backend
        run: timeout 120s python -B -m unittest tests.test_authority_documents -v
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint and focused product regression tests
        working-directory: frontend
        run: |
          timeout 120s npm run lint
          timeout 120s npm run test:tick-alpha
          timeout 120s npm run test:order-history-page
          timeout 120s npm run test:analytics-page
          timeout 120s npm run test:product-pages
          timeout 120s npm run test:confirm-outcome
      - name: Install pinned Playwright and official Chromium system dependencies
        run: |
          npm ci --prefix frontend/tests/browser-tools
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/riksora-playwright" \
            frontend/tests/browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Run isolated real-backend browser journey
        env:
          RIKSORA_BROWSER_TOOLS: ${{ github.workspace }}/frontend/tests/browser-tools
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/riksora-playwright
        run: |
          python -B -m unittest discover -s frontend/tests -p test_riksora_browser_gate.py -v
          for attempt in $(seq 1 10); do
            echo "Browser acceptance iteration ${attempt}/10"
            timeout 300s python -B frontend/tests/riksora_browser_gate.py \
              --tools frontend/tests/browser-tools \
              --browser-cache "$PLAYWRIGHT_BROWSERS_PATH"
          done
      - name: Publish sanitized browser acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riksora-browser-acceptance-report
          path: frontend/tests/artifacts/riksora-private-browser-*/report.json
          if-no-files-found: ignore
          retention-days: 7
