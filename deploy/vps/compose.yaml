name: backtest-lab
services:
  db:
    image: ${BTL_POSTGRES_IMAGE:?Supply immutable postgres image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: btl
      POSTGRES_USER: btl_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [db_password]
    volumes: [database:/var/lib/postgresql/data]
    networks: [database]
    shm_size: 128m
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD, pg_isready, -U, btl_owner, -d, btl]
      interval: 10s
      timeout: 5s
      retries: 10
  gateway:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
      args:
        NODE_IMAGE: ${BTL_NODE_IMAGE:?Supply immutable node image digest}
        CADDY_IMAGE: ${BTL_CADDY_IMAGE:?Supply immutable caddy image digest}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BTL_DOMAIN: ${BTL_DOMAIN:?Set owned domain}
      BTL_ACME_EMAIL: ${BTL_ACME_EMAIL:?Set certificate contact email}
    volumes: [certificates:/data, caddy_config:/config]
    networks: [edge, database]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.api
      args:
        PYTHON_IMAGE: ${BTL_PYTHON_IMAGE:?Supply immutable python image digest}
    restart: unless-stopped
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_started
      db:
        condition: service_healthy
    secrets: [runtime_config]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 256
    healthcheck:
      test: [CMD, python, /app/deploy/vps/runtime.py, health]
      interval: 30s
      timeout: 10s
      retries: 3
  operator:
    profiles: [ops]
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.api
      args:
        PYTHON_IMAGE: ${BTL_PYTHON_IMAGE:?Supply immutable python image digest}
    command: [python, /app/deploy/vps/ops.py, migrate]
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    secrets: [owner_config]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
secrets:
  db_password:
    file: ${BTL_SECRET_DIR:?Set private secret directory}/db_password
  runtime_config:
    file: ${BTL_SECRET_DIR:?Set private secret directory}/runtime.json
  owner_config:
    file: ${BTL_SECRET_DIR:?Set private secret directory}/owner.json
volumes:
  database:
  certificates:
  caddy_config:
networks:
  edge:
  database:
    internal: true
